<head>

    content="Contact Yonela Jongola for junior cloud, AI developer, full-stack, and security-focused roles."
  />
  <title>Contact | Yonela Jongola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header bg-light fixed-top">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html#home" class="d-flex align-items-center text-decoration-none" aria-label="Yonela Jongola home">
        <img src="images/logo.png" alt="Yonela Jongola logo" class="logo-img" />
      </a>

      <nav class="navbar navbar-expand-lg p-0" aria-label="Primary navigation">
        <button class="navbar-toggler" type="button" aria-controls="primaryNavigation" aria-expanded="false" aria-label="Toggle navigation" data-menu-toggle>
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="nav-menu" id="primaryNavigation" data-nav-menu>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#home" data-nav-link>Home</a></li>
            <li class="nav-item"><a class="nav-link" href="work.html" data-nav-link>Work</a></li>
            <li class="nav-item"><a class="nav-link" href="certificates.html" data-nav-link>Certificates</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html" data-nav-link>About</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html" data-nav-link>Contact</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="content-section bg-dark-section">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-5">
            <p class="section-eyebrow text-white-50">Contact</p>
            <h1 class="text-white">Let's work together</h1>
            <p class="text-white-50">Open to junior cloud, AI developer, full-stack, and security-focused roles.</p>
            <div class="contact-details">
              <a href="mailto:zjongola@gmail.com"><i class="fa-solid fa-envelope"></i> zjongola@gmail.com</a>
              <a href="https://www.linkedin.com/in/yonela-jongola" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
              <a href="https://github.com/yonelajongola" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> github.com/yonelajongola</a>
              <p><i class="fa-solid fa-location-dot"></i> Cape Town, South Africa</p>
            </div>
          </div>
          <div class="col-lg-7">
            <form class="contact-form" action="https://formspree.io/f/mwkalajy" method="POST">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" autocomplete="name" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="_replyto" class="form-control" autocomplete="email" required />
              </div>
              <div class="mb-4">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" class="form-control" rows="6" required></textarea>
              </div>
              <button type="submit" class="btn btn-branding">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer bg-light">
    <div class="container text-center">
      <a href="mailto:zjongola@gmail.com" class="email-link">zjongola@gmail.com</a>
      <div class="social-links d-flex justify-content-center my-4">
        <a href="https://github.com/yonelajongola" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/yonela-jongola" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile"><i class="fab fa-linkedin-in"></i></a>
        <a href="https://twitter.com/yonelajongola" target="_blank" rel="noopener noreferrer" aria-label="Twitter profile"><i class="fab fa-twitter"></i></a>
      </div>
      <p class="small text-muted mb-0">Yonela Jongola | AI Cloud Developer</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
